<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/icons/gamepad.svg" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <title>Games DataBase - Dead Cells</title>
  </head>

  <body>
    <main class="jogos">
      <section>
        <header class="jogos-titulo">
          <h1>Jogos</h1>
        </header>
        <div class="container-jogos">
          <article class="jogo">
            <figure class="jogo-logo">
              <img
                src="../assets/images/dead-cells.png"
                alt="Logo do Dead Cells"
              />
            </figure>
            <h2>Dead Cells</h2>
            <h3>Informações Técnicas</h3>
            <hr />
            <div class="container-tabela">
              <table class="info-jogo">
                <tbody>
                  <tr>
                    <th>Plataformas:</th>
                    <td>Android</td>
                    <td>iOS</td>
                    <td>Nintendo Switch</td>
                    <td>PlayStation 4/5</td>
                    <td>Windows</td>
                    <td>Xbox One/Series</td>
                  </tr>
                  <tr>
                    <th>Desenvolvedora:</th>
                    <td>Motion Twin</td>
                  </tr>
                  <tr>
                    <th>Publicadora:</th>
                    <td>Motion Twin</td>
                  </tr>
                  <tr>
                    <th>Gênero:</th>
                    <td>Dungeon Crawler</td>
                    <td>Metroidvania</td>
                    <td>Roguelike</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </article>
        </div>
      </section>
      <a href="../../index.html" title="Voltar para o Início" class="btn-voltar"
        >Voltar</a
      >
    </main>

    <script src="./src/js/index.js"></script>
  </body>
</html>
